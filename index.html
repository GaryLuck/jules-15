<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Tile Puzzle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 5px;
            background-color: #333;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
            transition: background-color 0.2s;
        }
        .tile:hover {
            background-color: #e0e0e0;
        }
        .empty-tile {
            background-color: #333;
            cursor: default;
        }
    </style>
</head>
<body>

<div id="puzzle-container"></div>

<script>
    const container = document.getElementById('puzzle-container');
    const size = 4;
    let tiles = [];

    // Initialize solved board
    for (let i = 1; i < size * size; i++) {
        tiles.push(i);
    }
    tiles.push(null); // The empty spot

    // Shuffle the board (Fisher-Yates) - but we must ensure it's solvable
    // To make it simple, we can just perform many valid random moves from solved state
    function shuffleTiles() {
        let emptyIdx = tiles.length - 1;
        for (let i = 0; i < 1000; i++) {
            const neighbors = [];
            const row = Math.floor(emptyIdx / size);
            const col = emptyIdx % size;

            if (row > 0) neighbors.push(emptyIdx - size);
            if (row < size - 1) neighbors.push(emptyIdx + size);
            if (col > 0) neighbors.push(emptyIdx - 1);
            if (col < size - 1) neighbors.push(emptyIdx + 1);

            const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];

            // Swap
            tiles[emptyIdx] = tiles[randomNeighbor];
            tiles[randomNeighbor] = null;
            emptyIdx = randomNeighbor;
        }
    }

    function renderBoard() {
        container.innerHTML = '';
        tiles.forEach((tile, index) => {
            const tileDiv = document.createElement('div');
            if (tile === null) {
                tileDiv.classList.add('empty-tile');
            } else {
                tileDiv.classList.add('tile');
                tileDiv.textContent = tile;
                tileDiv.addEventListener('click', () => handleTileClick(index));
            }
            container.appendChild(tileDiv);
        });
    }

    function handleTileClick(index) {
        const emptyIdx = tiles.indexOf(null);

        const row = Math.floor(index / size);
        const col = index % size;
        const emptyRow = Math.floor(emptyIdx / size);
        const emptyCol = emptyIdx % size;

        const isAdjacent = (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                           (Math.abs(col - emptyCol) === 1 && row === emptyRow);

        if (isAdjacent) {
            // Swap
            tiles[emptyIdx] = tiles[index];
            tiles[index] = null;
            renderBoard();
            checkWin();
        }
    }

    function checkWin() {
        let isWin = true;
        for (let i = 0; i < tiles.length - 1; i++) {
            if (tiles[i] !== i + 1) {
                isWin = false;
                break;
            }
        }
        if (isWin && tiles[tiles.length - 1] === null) {
            setTimeout(() => alert('Congratulations! You solved the puzzle!'), 10);
        }
    }

    shuffleTiles();
    renderBoard();
</script>

</body>
</html>
